<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gốm Vũ Gia · Chấm công & Lương</title>
<style>
:root{color-scheme:light dark;--bg:#f6efe9;--card:#fff;--ink:#2c2522;--muted:#7a6e68;--line:#e4d8cf;--brand:#9a5e3a}
@media(prefers-color-scheme:dark){:root{--bg:#191614;--card:#26211e;--ink:#f2ebe5;--muted:#a89b92;--line:#3b332e;--brand:#c07f56}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
form{width:100%;max-width:340px;padding:28px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
h1{margin:0 0 4px;font-size:22px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#msg{min-height:20px;margin:10px 0 0;color:#c0392b;font-size:14px}
</style>
</head>
<body>
<form method="post" action="/door">
  <h1>Gốm Vũ Gia</h1>
  <p>Trang nội bộ. Nhập mật khẩu của cửa hàng để vào.</p>
  <label for="password">Mật khẩu cửa hàng</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Vào</button>
  <p id="msg"></p>
</form>
<script>
const q=location.search;document.getElementById('msg').textContent=q.includes('khoa')?'Thử sai nhiều lần. Đợi 15 phút rồi nhập lại.':q.includes('sai')?'Sai mật khẩu.':'';
</script>
</body>
</html>
